name: Affiliate 404 Guard Weekly

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/affiliate-404-guard.js
